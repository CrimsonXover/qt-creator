name: Build Qt Creator 20 for Ubuntu 20.04

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Qt Creator branch or tag to build"
        required: true
        default: "v20.0.0"

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  QTC_VERSION: "20.0.0"
  QT_VERSION: "6.11.1"
  BUILD_DIR: ${{ github.workspace }}/build-qtcreator
  INSTALL_DIR: ${{ github.workspace }}/package/QtCreator-20.0.0-Ubuntu20.04-x86_64
  LLVM_DIR: ${{ github.workspace }}/llvm
  LLVM_ARCHIVE_URL: https://download.qt.io/development_releases/prebuilt/libclang/qt/libclang-release_17.0.6-based-linux-Rhel8.8-gcc10.0-x86_64.7z
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  build:
    name: Compile Qt Creator
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Install Ubuntu build packages
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            git \
            bzip2 \
            tar \
            xz-utils \
            p7zip-full \
            file \
            pkg-config \
            patchelf \
            chrpath \
            libgl1-mesa-dev \
            libxkbcommon-x11-dev \
            libxcb-xinput-dev \
            libxcb-xinerama0-dev \
            libsecret-1-dev \
            libdw-dev \
            libelf-dev \
            fontconfig \
            fonts-dejavu-core

          rm -rf /var/lib/apt/lists/*

      - name: Check out Qt Creator source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: false

      - name: Fix and fetch Qt Creator submodules
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          git config -f .gitmodules \
            submodule.perfparser.url \
            https://github.com/qt-creator/perfparser.git

          git config -f .gitmodules \
            submodule.qbs.url \
            https://github.com/qbs/qbs.git

          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Create Micromamba build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qtcreator-build
          create-args: >-
            python=3.12
            cmake>=3.30
            ninja
            gcc_linux-64=14
            gxx_linux-64=14
            pkg-config
            patchelf
            go
            qt6-main=6.11.1
            qt6-quick3d=6.11.1
            qt6-serialport=6.11.1
            qt6-webengine=6.11.1
          init-shell: bash
          generate-run-shell: true
          post-cleanup: all

      - name: Verify required Qt development modules
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          cmake --version
          ninja --version
          "$CC" --version

          test -f "$CONDA_PREFIX/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6QuickWidgets/Qt6QuickWidgetsConfig.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6Designer/Qt6DesignerConfig.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6Help/Qt6HelpConfig.cmake"

          QMAKE="$(find "$CONDA_PREFIX" -type f -path '*/bin/qmake' -print -quit)"
          test -n "$QMAKE"
          "$QMAKE" -query

      - name: Patch bundled libarchive for Ubuntu 20.04
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          CONFIG_FILE="$GITHUB_WORKSPACE/src/libs/3rdparty/libarchive/config_unix.h"
          test -f "$CONFIG_FILE"

          sed -i \
            -e 's/^#define HAVE_CLOSEFROM 1$/#define HAVE_CLOSEFROM 0/' \
            -e 's/^#define HAVE_CLOSE_RANGE 1$/#define HAVE_CLOSE_RANGE 0/' \
            "$CONFIG_FILE"

          grep -q '^#define HAVE_CLOSEFROM 0$' "$CONFIG_FILE"
          grep -q '^#define HAVE_CLOSE_RANGE 0$' "$CONFIG_FILE"

      - name: Download LLVM and Clang
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_DIR"
          mkdir -p "$LLVM_DIR"

          curl --fail --location --retry 5 --retry-delay 5 \
            "$LLVM_ARCHIVE_URL" \
            --output /tmp/libclang.7z

          7z x /tmp/libclang.7z "-o$LLVM_DIR"
          rm -f /tmp/libclang.7z

          CLANG_CONFIG="$(find "$LLVM_DIR" -type f -name ClangConfig.cmake -print -quit)"
          test -n "$CLANG_CONFIG"

          LLVM_PREFIX="$(dirname "$(dirname "$(dirname "$(dirname "$CLANG_CONFIG")")")")"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"

      - name: Configure complete Qt Creator
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          rm -rf "$BUILD_DIR" "$INSTALL_DIR"

          # The Micromamba pkg-config executable does not automatically search
          # Ubuntu's multiarch pkg-config directory.
          export PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"

          cmake \
            -S "$GITHUB_WORKSPACE" \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX;$LLVM_PREFIX" \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DQT_NO_PRIVATE_MODULE_WARNING=ON \
            -DWITH_TESTS=OFF \
            -DWITH_QMLDESIGNER=ON \
            -DENABLE_SVG_SUPPORT=ON \
            -DBUILD_QBS=ON \
            -DBUILD_PLUGINS_BY_DEFAULT=ON \
            -DBUILD_EXECUTABLES_BY_DEFAULT=ON \
            -DBUILD_LIBRARIES_BY_DEFAULT=ON \
            -DBUILD_EXECUTABLE_CMDBRIDGE=ON

          grep -q '^WITH_QMLDESIGNER:BOOL=ON$' "$BUILD_DIR/CMakeCache.txt"
          grep -q '^ENABLE_SVG_SUPPORT:BOOL=ON$' "$BUILD_DIR/CMakeCache.txt"
          grep -q '^BUILD_QBS:BOOL=ON$' "$BUILD_DIR/CMakeCache.txt"

          TARGETS_FILE="$BUILD_DIR/ninja-targets.txt"
          ninja -C "$BUILD_DIR" -t targets all > "$TARGETS_FILE"
          grep -q '^QmlDesigner:' "$TARGETS_FILE"
          grep -q '^Designer:' "$TARGETS_FILE"

      - name: Build Qt Creator
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail
          cmake --build "$BUILD_DIR" --parallel 2

      - name: Install Qt Creator without external runtime dependencies
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          rm -rf "$INSTALL_DIR"
          mkdir -p "$INSTALL_DIR"

          # Deliberately do not install the Dependencies component in this job.
          # The resulting tree is persisted, so packaging can be retried without
          # compiling Qt Creator again.
          cmake --install "$BUILD_DIR" --prefix "$INSTALL_DIR"

          test -x "$INSTALL_DIR/bin/qtcreator"
          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libDesigner.so"
          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libQmlDesigner.so"

      - name: Archive reusable compiled stage
        shell: bash
        run: |
          set -euxo pipefail

          STAGE_ARCHIVE="$GITHUB_WORKSPACE/qtcreator-compiled-stage.tar.xz"

          tar \
            -C "$(dirname "$INSTALL_DIR")" \
            -cJf "$STAGE_ARCHIVE" \
            "$(basename "$INSTALL_DIR")"

          sha256sum "$STAGE_ARCHIVE"
          ls -lh "$STAGE_ARCHIVE"

      - name: Upload reusable compiled stage
        uses: actions/upload-artifact@v4
        with:
          name: qtcreator-compiled-stage
          path: qtcreator-compiled-stage.tar.xz
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  package:
    name: Package Qt Creator
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:20.04

    steps:
      - name: Install Ubuntu packaging packages
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            git \
            tar \
            xz-utils \
            p7zip-full \
            file \
            patchelf \
            chrpath \
            libdw-dev \
            libelf-dev \
            fontconfig \
            fonts-dejavu-core

          rm -rf /var/lib/apt/lists/*

      - name: Check out packaging scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 1
          submodules: false

      - name: Create Micromamba packaging environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qtcreator-build
          create-args: >-
            python=3.12
            patchelf
            qt6-main=6.11.1
            qt6-quick3d=6.11.1
            qt6-serialport=6.11.1
            qt6-webengine=6.11.1
          init-shell: bash
          generate-run-shell: true
          post-cleanup: all

      - name: Download compiled Qt Creator stage
        uses: actions/download-artifact@v5
        with:
          name: qtcreator-compiled-stage
          path: /tmp/qtcreator-stage

      - name: Restore compiled Qt Creator stage
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf "$INSTALL_DIR"
          mkdir -p "$(dirname "$INSTALL_DIR")"

          tar \
            -C "$(dirname "$INSTALL_DIR")" \
            -xf /tmp/qtcreator-stage/qtcreator-compiled-stage.tar.xz

          test -x "$INSTALL_DIR/bin/qtcreator"

      - name: Install quiet chrpath wrapper backed by patchelf
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -x /usr/bin/chrpath && ! -e /usr/bin/chrpath.real ]]; then
            mv /usr/bin/chrpath /usr/bin/chrpath.real
          fi

          cat > /usr/bin/chrpath <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          case "${1:-}" in
            -l)
              file="${2:?missing ELF file}"

              # Qt Creator probes executable-looking files and *.so names.
              # Non-ELF and static ELF files should behave like "no RPATH",
              # without printing patchelf diagnostics.
              if ! rpath="$(/usr/bin/patchelf --print-rpath "$file" 2>/dev/null)"; then
                exit 1
              fi

              [[ -n "$rpath" ]] || exit 1
              printf '%s: RUNPATH=%s\n' "$file" "$rpath"
              ;;

            -r)
              new_rpath="${2:?missing new RPATH}"
              file="${3:?missing ELF file}"
              /usr/bin/patchelf --set-rpath "$new_rpath" "$file"
              ;;

            -d)
              file="${2:?missing ELF file}"
              /usr/bin/patchelf --remove-rpath "$file"
              ;;

            --version|-v)
              echo "chrpath compatibility wrapper using $(/usr/bin/patchelf --version)"
              ;;

            *)
              echo "Unsupported chrpath arguments: $*" >&2
              exit 2
              ;;
          esac
          SCRIPT

          chmod +x /usr/bin/chrpath
          /usr/bin/chrpath --version

      - name: Adapt conda-forge Qt WebEngine layout
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          # conda-forge builds Qt WebEngine with INSTALL_LIBEXECDIR=lib/qt6,
          # while Qt Creator 20's deploy.py looks in <prefix>/libexec.
          WEBENGINE_PROCESS="$(
            find "$CONDA_PREFIX" \
              -type f \
              -name QtWebEngineProcess \
              -perm -u+x \
              -print -quit
          )"

          test -n "$WEBENGINE_PROCESS"
          echo "QtWebEngineProcess source: $WEBENGINE_PROCESS"

          mkdir -p "$CONDA_PREFIX/libexec"
          ln -sfn "$WEBENGINE_PROCESS" \
            "$CONDA_PREFIX/libexec/QtWebEngineProcess"

          test -x "$CONDA_PREFIX/libexec/QtWebEngineProcess"

          # deploy.py also expects WebEngine resources in <prefix>/resources.
          WEBENGINE_RESOURCES="$(
            find "$CONDA_PREFIX" \
              -type d \
              -name resources \
              -exec test -f '{}/icudtl.dat' ';' \
              -print -quit
          )"

          if [[ -n "$WEBENGINE_RESOURCES" && "$WEBENGINE_RESOURCES" != "$CONDA_PREFIX/resources" ]]; then
            rm -rf "$CONDA_PREFIX/resources"
            ln -s "$WEBENGINE_RESOURCES" "$CONDA_PREFIX/resources"
          fi

          find "$CONDA_PREFIX" -maxdepth 5 \
            \( -name QtWebEngineProcess -o -name icudtl.dat \) \
            -print

      - name: Locate qmake
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          QMAKE="$(find "$CONDA_PREFIX" -type f -path '*/bin/qmake' -print -quit)"
          test -n "$QMAKE"

          echo "BUILD_QMAKE=$QMAKE" >> "$GITHUB_ENV"
          "$QMAKE" -query

      - name: Download LLVM and Clang for packaging
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_DIR"
          mkdir -p "$LLVM_DIR"

          curl --fail --location --retry 5 --retry-delay 5 \
            "$LLVM_ARCHIVE_URL" \
            --output /tmp/libclang.7z

          7z x /tmp/libclang.7z "-o$LLVM_DIR"
          rm -f /tmp/libclang.7z

          CLANG_CONFIG="$(find "$LLVM_DIR" -type f -name ClangConfig.cmake -print -quit)"
          test -n "$CLANG_CONFIG"

          LLVM_PREFIX="$(dirname "$(dirname "$(dirname "$(dirname "$CLANG_CONFIG")")")")"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"

      - name: Deploy Qt, LLVM and optional elfutils dependencies
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          DEPLOY_ARGS=(
            --llvm-path "$LLVM_PREFIX"
          )

          # Only request elfutils deployment when the corresponding plugin was
          # actually built.
          if find "$INSTALL_DIR/lib/qtcreator/plugins" \
              -maxdepth 1 \
              -type f \
              -iname '*perf*profiler*.so' \
              -print -quit | grep -q .; then
            DEPLOY_ARGS+=(--elfutils-path /usr)
          fi

          python "$GITHUB_WORKSPACE/scripts/deploy.py" \
            "${DEPLOY_ARGS[@]}" \
            "$INSTALL_DIR/bin/qtcreator" \
            "$BUILD_QMAKE"

          test -x "$INSTALL_DIR/lib/Qt/libexec/QtWebEngineProcess"

      - name: Finalize isolated runtime
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          mkdir -p "$INSTALL_DIR/lib/Qt/lib"

          for library in \
            libstdc++.so.6 \
            libgcc_s.so.1 \
            libatomic.so.1 \
            libgomp.so.1
          do
            source_library="$CONDA_PREFIX/lib/$library"
            if [[ -e "$source_library" ]]; then
              cp -L "$source_library" "$INSTALL_DIR/lib/Qt/lib/$library"
            fi
          done

          # Keep the bundled Qt as an IDE runtime, not a project SDK.
          rm -rf \
            "$INSTALL_DIR/lib/Qt/include" \
            "$INSTALL_DIR/lib/Qt/mkspecs" \
            "$INSTALL_DIR/lib/Qt/lib/cmake" \
            "$INSTALL_DIR/lib/Qt/lib/pkgconfig"

          rm -f \
            "$INSTALL_DIR/lib/Qt/bin/qmake" \
            "$INSTALL_DIR/lib/Qt/bin/qmake6" \
            "$INSTALL_DIR/lib/Qt/bin/qtpaths" \
            "$INSTALL_DIR/lib/Qt/bin/qtpaths6"

          find "$INSTALL_DIR/lib/Qt" -type f \
            \( -name '*.prl' -o -name '*.la' \) \
            -delete

          cat > "$INSTALL_DIR/qtcreator.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          unset QT_PLUGIN_PATH
          unset QT_QPA_PLATFORM_PLUGIN_PATH
          unset QML_IMPORT_PATH
          unset QML2_IMPORT_PATH
          unset QTDIR
          unset QT_SELECT

          export FONTCONFIG_FILE="${FONTCONFIG_FILE:-/etc/fonts/fonts.conf}"
          export FONTCONFIG_PATH="${FONTCONFIG_PATH:-/etc/fonts}"

          exec "$ROOT/bin/qtcreator" "$@"
          SCRIPT

          chmod +x "$INSTALL_DIR/qtcreator.sh"

          cat > "$INSTALL_DIR/README-Ubuntu20.txt" <<'README'
          Start Qt Creator with:

              ./qtcreator.sh

          The Qt installation under lib/Qt is only the private IDE runtime.
          It is intentionally not added to PATH and is not a project SDK.

          Add the Qt used by your projects in:
          Preferences/Options -> Kits -> Qt Versions -> Add
          README

      - name: Validate packaged runtime
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          test -f "$INSTALL_DIR/bin/qt.conf"
          grep -q '^Prefix=../lib/Qt$' "$INSTALL_DIR/bin/qt.conf"

          test -f "$INSTALL_DIR/lib/Qt/plugins/platforms/libqxcb.so"
          test -f "$INSTALL_DIR/lib/Qt/plugins/imageformats/libqsvg.so"
          test -f "$INSTALL_DIR/lib/Qt/plugins/iconengines/libqsvgicon.so"
          test -f "$INSTALL_DIR/lib/Qt/lib/libQt6Svg.so.6"
          test -x "$INSTALL_DIR/lib/Qt/libexec/QtWebEngineProcess"

          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libDesigner.so"
          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libQmlDesigner.so"
          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libQbsProjectManager.so"
          test -x "$INSTALL_DIR/libexec/qtcreator/clang/bin/clangd"

          test ! -e "$INSTALL_DIR/lib/Qt/bin/qmake"
          test ! -e "$INSTALL_DIR/lib/Qt/bin/qmake6"
          test ! -d "$INSTALL_DIR/lib/Qt/lib/cmake"
          test ! -d "$INSTALL_DIR/lib/Qt/include"

          MISSING_FILE="$GITHUB_WORKSPACE/missing-libraries.txt"
          : > "$MISSING_FILE"

          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q '^ELF '; then
              if ldd "$candidate" 2>/dev/null \
                  | grep -F 'not found' >> "$MISSING_FILE"; then
                echo "Missing dependency in: $candidate" >> "$MISSING_FILE"
              fi
            fi
          done < <(find "$INSTALL_DIR" -type f -print0)

          if [[ -s "$MISSING_FILE" ]]; then
            cat "$MISSING_FILE"
            exit 1
          fi

          mkdir -p /tmp/qtcreator-test-home

          env -i \
            HOME=/tmp/qtcreator-test-home \
            USER=runner \
            PATH=/usr/bin:/bin \
            FONTCONFIG_FILE=/etc/fonts/fonts.conf \
            FONTCONFIG_PATH=/etc/fonts \
            QT_QPA_PLATFORM=offscreen \
            "$INSTALL_DIR/bin/qtcreator" -version

      - name: Create final archive and checksum
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/qtcreator-${QTC_VERSION}-ubuntu20.04-x86_64-complete.tar.xz"

          tar \
            -C "$(dirname "$INSTALL_DIR")" \
            -cJf "$ARCHIVE" \
            "$(basename "$INSTALL_DIR")"

          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Upload final Qt Creator artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtcreator-${{ env.QTC_VERSION }}-ubuntu20.04-x86_64-complete
          path: |
            qtcreator-${{ env.QTC_VERSION }}-ubuntu20.04-x86_64-complete.tar.xz
            qtcreator-${{ env.QTC_VERSION }}-ubuntu20.04-x86_64-complete.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14
          overwrite: true
