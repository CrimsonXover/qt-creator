name: Build complete Qt Creator 20 for Ubuntu 20.04

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Qt Creator branch or tag to build"
        required: true
        default: "master"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    # GitHub no longer supplies an Ubuntu 20.04 hosted runner.
    # Compilation and packaging happen inside this Ubuntu 20.04 container.
    container:
      image: ubuntu:20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      QTC_VERSION: "20.0.0"
      QT_VERSION: "6.11.1"
      BUILD_DIR: ${{ github.workspace }}/build-qtcreator
      INSTALL_DIR: ${{ github.workspace }}/package/QtCreator-20.0.0-Ubuntu20.04-x86_64
      LLVM_DIR: ${{ github.workspace }}/llvm
      LLVM_ARCHIVE_URL: https://download.qt.io/development_releases/prebuilt/libclang/qt/libclang-release_17.0.6-based-linux-Rhel8.8-gcc10.0-x86_64.7z
      CMAKE_BUILD_PARALLEL_LEVEL: "2"

    steps:
      - name: Install Ubuntu bootstrap packages
        shell: bash
        run: |
          set -euxo pipefail

          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            ca-certificates \
            curl \
            git \
            bzip2 \
            tar \
            xz-utils \
            p7zip-full \
            file \
            pkg-config \
            patchelf \
            chrpath \
            libgl1-mesa-dev \
            libxkbcommon-x11-dev \
            libxcb-xinput-dev \
            libxcb-xinerama0-dev \
            fontconfig \
            fonts-dejavu-core

          rm -rf /var/lib/apt/lists/*

      - name: Check out Qt Creator source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          submodules: false

      - name: Fix and fetch Qt Creator submodules
        shell: bash
        run: |
          set -euxo pipefail

          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Relative submodule URLs resolve against a fork owner. Use the
          # actual upstream locations.
          git config -f .gitmodules \
            submodule.perfparser.url \
            https://github.com/qt-creator/perfparser.git

          git config -f .gitmodules \
            submodule.qbs.url \
            https://github.com/qbs/qbs.git

          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Create Micromamba build environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: qtcreator-build
          create-args: >-
            python=3.12
            cmake>=3.30
            ninja
            gcc_linux-64=14
            gxx_linux-64=14
            pkg-config
            patchelf
            go
            libsecret
            glib
            elfutils
            zlib
            qt6-main=6.11.1
            qt6-quick3d=6.11.1
            qt6-serialport=6.11.1
            qt6-webengine=6.11.1
          init-shell: bash
          generate-run-shell: true
          post-cleanup: all

      - name: Verify Micromamba native dependencies
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          # Do not let conda's pkg-config reinterpret Ubuntu host .pc files.
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig:$CONDA_PREFIX/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$PKG_CONFIG_PATH"
          unset PKG_CONFIG_SYSROOT_DIR

          command -v pkg-config
          pkg-config --version

          LIBSECRET_PC_DIR="$(pkg-config --variable=pcfiledir libsecret-1)"
          echo "libsecret pc directory: $LIBSECRET_PC_DIR"
          case "$LIBSECRET_PC_DIR" in
            "$CONDA_PREFIX"/*) ;;
            *)
              echo "libsecret was not resolved from the Micromamba environment." >&2
              exit 1
              ;;
          esac

          # gio-2.0 (used by libsecret) references zlib.pc. The `zlib`
          # development package must therefore be present, not only libzlib.
          test -f "$CONDA_PREFIX/lib/pkgconfig/zlib.pc"
          test -f "$CONDA_PREFIX/lib/pkgconfig/glib-2.0.pc"
          test -f "$CONDA_PREFIX/lib/glib-2.0/include/glibconfig.h"

          pkg-config --modversion zlib
          pkg-config --modversion glib-2.0
          pkg-config --cflags --libs glib-2.0
          pkg-config --cflags --libs gio-2.0
          pkg-config --cflags --libs libsecret-1

          # Compile a real GLib probe now. pkg-config can succeed even when
          # the generated architecture-specific glibconfig.h is absent.
          cat > /tmp/glib-probe.c <<'PROBE'
          #include <glib.h>
          int main(void)
          {
              return GLIB_MAJOR_VERSION > 0 ? 0 : 1;
          }
          PROBE

          "$CC"             $(pkg-config --cflags glib-2.0)             -c /tmp/glib-probe.c             -o /tmp/glib-probe.o

          test -s /tmp/glib-probe.o
          rm -f /tmp/glib-probe.c /tmp/glib-probe.o

          test -f "$CONDA_PREFIX/include/libsecret-1/libsecret/secret.h"
          test -e "$CONDA_PREFIX/lib/libsecret-1.so"
          test -e "$CONDA_PREFIX/lib/libdw.so"
          test -e "$CONDA_PREFIX/lib/libelf.so"

          # Persist the isolated pkg-config configuration for CMake.
          {
            echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
            echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR"
          } >> "$GITHUB_ENV"

      - name: Replace chrpath with a patchelf-compatible wrapper
        shell: bash
        run: |
          set -euxo pipefail

          if [[ -x /usr/bin/chrpath && ! -e /usr/bin/chrpath.real ]]; then
            mv /usr/bin/chrpath /usr/bin/chrpath.real
          fi

          cat > /usr/bin/chrpath <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          case "${1:-}" in
            -l)
              file="${2:?missing ELF file}"

              # Qt Creator's deploy helper probes executable files that are
              # sometimes scripts, archives, or statically linked objects.
              # Real chrpath quietly reports "no RPATH"; avoid noisy patchelf
              # diagnostics for files that have no dynamic ELF section.
              /usr/bin/file -Lb "$file" | grep -q '^ELF ' || exit 1

              rpath="$(/usr/bin/patchelf --print-rpath "$file" 2>/dev/null)" \
                || exit 1
              [[ -n "$rpath" ]] || exit 1

              printf '%s: RUNPATH=%s\n' "$file" "$rpath"
              ;;
            -r)
              new_rpath="${2:?missing new RPATH}"
              file="${3:?missing ELF file}"
              /usr/bin/patchelf --set-rpath "$new_rpath" "$file"
              ;;
            -d)
              file="${2:?missing ELF file}"
              /usr/bin/patchelf --remove-rpath "$file"
              ;;
            --version|-v)
              echo "chrpath compatibility wrapper using $(/usr/bin/patchelf --version)"
              ;;
            *)
              echo "Unsupported chrpath arguments: $*" >&2
              exit 2
              ;;
          esac
          SCRIPT

          chmod +x /usr/bin/chrpath
          /usr/bin/chrpath --version

      - name: Verify required Qt development modules
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          echo "CONDA_PREFIX=$CONDA_PREFIX"
          echo "CC=$CC"
          echo "CXX=$CXX"

          cmake --version
          ninja --version
          "$CC" --version

          test -f "$CONDA_PREFIX/lib/cmake/Qt6/Qt6Config.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6Svg/Qt6SvgConfig.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6QuickWidgets/Qt6QuickWidgetsConfig.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6Designer/Qt6DesignerConfig.cmake"
          test -f "$CONDA_PREFIX/lib/cmake/Qt6Help/Qt6HelpConfig.cmake"

          QMAKE="$(find "$CONDA_PREFIX" -type f -path '*/bin/qmake' -print -quit)"
          test -n "$QMAKE"
          echo "BUILD_QMAKE=$QMAKE" >> "$GITHUB_ENV"
          "$QMAKE" -query

      - name: Patch bundled libarchive for portable glibc baseline
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          CONFIG_FILE="$GITHUB_WORKSPACE/src/libs/3rdparty/libarchive/config_unix.h"
          test -f "$CONFIG_FILE"

          sed -i \
            -e 's/^#define HAVE_CLOSEFROM 1$/#define HAVE_CLOSEFROM 0/' \
            -e 's/^#define HAVE_CLOSE_RANGE 1$/#define HAVE_CLOSE_RANGE 0/' \
            "$CONFIG_FILE"

          grep -q '^#define HAVE_CLOSEFROM 0$' "$CONFIG_FILE"
          grep -q '^#define HAVE_CLOSE_RANGE 0$' "$CONFIG_FILE"

      - name: Download LLVM and Clang
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          rm -rf "$LLVM_DIR"
          mkdir -p "$LLVM_DIR"

          curl --fail --location --retry 5 --retry-delay 5 \
            "$LLVM_ARCHIVE_URL" \
            --output /tmp/libclang.7z

          7z x /tmp/libclang.7z "-o$LLVM_DIR"
          rm -f /tmp/libclang.7z

          CLANG_CONFIG="$(find "$LLVM_DIR" -type f -name ClangConfig.cmake -print -quit)"
          test -n "$CLANG_CONFIG"

          LLVM_PREFIX="$(dirname "$(dirname "$(dirname "$(dirname "$CLANG_CONFIG")")")")"
          echo "LLVM_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM prefix: $LLVM_PREFIX"

      - name: Configure complete Qt Creator
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          rm -rf "$BUILD_DIR" "$INSTALL_DIR"

          cmake \
            -S "$GITHUB_WORKSPACE" \
            -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" \
            -DCMAKE_CXX_COMPILER="$CXX" \
            "-DCMAKE_PREFIX_PATH=$CONDA_PREFIX;$LLVM_PREFIX" \
            "-DPKG_CONFIG_EXECUTABLE=$CONDA_PREFIX/bin/pkg-config" \
            "-DELFUTILS_INSTALL_DIR=$CONDA_PREFIX" \
            -DLIBSECRET_SUPPORT=ON \
            -DCMAKE_INSTALL_RPATH_USE_LINK_PATH=ON \
            -DWITH_TESTS=OFF \
            -DWITH_QMLDESIGNER=ON \
            -DENABLE_SVG_SUPPORT=ON \
            -DBUILD_QBS=ON \
            -DBUILD_PLUGINS_BY_DEFAULT=ON \
            -DBUILD_EXECUTABLES_BY_DEFAULT=ON \
            -DBUILD_LIBRARIES_BY_DEFAULT=ON \
            -DBUILD_EXECUTABLE_CMDBRIDGE=ON

          grep -q '^WITH_QMLDESIGNER:BOOL=ON$' "$BUILD_DIR/CMakeCache.txt"
          grep -q '^ENABLE_SVG_SUPPORT:BOOL=ON$' "$BUILD_DIR/CMakeCache.txt"
          grep -q '^BUILD_QBS:BOOL=ON$' "$BUILD_DIR/CMakeCache.txt"
          grep -q '^LIBSECRET_SUPPORT:BOOL=ON$' "$BUILD_DIR/CMakeCache.txt"

          # Verify that CMake did not recreate the malformed /usr/lib/include path.
          if grep -R -F '/usr/lib/include/libsecret-1' "$BUILD_DIR" 2>/dev/null; then
            echo "CMake resolved libsecret through an invalid host path." >&2
            exit 1
          fi

          grep -F "LIBSECRET_INCLUDE_DIRS:INTERNAL=$CONDA_PREFIX/include/libsecret-1" \
            "$BUILD_DIR/CMakeCache.txt" >/dev/null

          # Fail during configuration rather than producing an artifact without
          # the two Designer integrations.
          # Do not pipe Ninja directly into grep -q while pipefail is active.
          # grep exits as soon as it finds a match, which gives Ninja SIGPIPE
          # and makes the step fail with exit code 141.
          TARGETS_FILE="$BUILD_DIR/ninja-targets.txt"
          ninja -C "$BUILD_DIR" -t targets all > "$TARGETS_FILE"
          grep -q '^QmlDesigner:' "$TARGETS_FILE"
          grep -q '^Designer:' "$TARGETS_FILE"

      - name: Build Qt Creator
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail
          cmake --build "$BUILD_DIR" --parallel 2

      - name: Normalize conda Qt WebEngine deployment layout
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          QT_PREFIX="$("$BUILD_QMAKE" -query QT_INSTALL_PREFIX)"
          QT_LIBEXECS="$("$BUILD_QMAKE" -query QT_INSTALL_LIBEXECS)"
          QT_DATA="$("$BUILD_QMAKE" -query QT_INSTALL_DATA)"
          QT_TRANSLATIONS="$("$BUILD_QMAKE" -query QT_INSTALL_TRANSLATIONS)"

          echo "QT_PREFIX=$QT_PREFIX"
          echo "QT_LIBEXECS=$QT_LIBEXECS"
          echo "QT_DATA=$QT_DATA"
          echo "QT_TRANSLATIONS=$QT_TRANSLATIONS"

          test "$QT_PREFIX" = "$CONDA_PREFIX"

          # Qt Creator 20's deploy.py looks specifically under
          # QT_INSTALL_PREFIX/libexec, rather than using QT_INSTALL_LIBEXECS.
          # conda-forge may place this binary in a Qt-specific libexec path.
          WEBENGINE_PROCESS=""

          for candidate in \
            "$QT_LIBEXECS/QtWebEngineProcess" \
            "$QT_PREFIX/lib/qt6/libexec/QtWebEngineProcess" \
            "$QT_PREFIX/libexec/QtWebEngineProcess"
          do
            if [[ -x "$candidate" ]]; then
              WEBENGINE_PROCESS="$candidate"
              break
            fi
          done

          if [[ -z "$WEBENGINE_PROCESS" ]]; then
            WEBENGINE_PROCESS="$(
              find -L "$QT_PREFIX" \
                -type f \
                -name QtWebEngineProcess \
                -perm /111 \
                -print \
                -quit
            )"
          fi

          if [[ -z "$WEBENGINE_PROCESS" || ! -x "$WEBENGINE_PROCESS" ]]; then
            echo "qt6-webengine is installed, but QtWebEngineProcess was not found." >&2
            find "$QT_PREFIX" -maxdepth 6 -iname '*webengine*' -print || true
            exit 1
          fi

          echo "QtWebEngineProcess source: $WEBENGINE_PROCESS"

          mkdir -p "$QT_PREFIX/libexec"
          if [[ "$WEBENGINE_PROCESS" != "$QT_PREFIX/libexec/QtWebEngineProcess" ]]; then
            ln -sfn "$WEBENGINE_PROCESS" \
              "$QT_PREFIX/libexec/QtWebEngineProcess"
          fi
          test -x "$QT_PREFIX/libexec/QtWebEngineProcess"

          # deploy.py also assumes WebEngine resources are directly below
          # QT_INSTALL_PREFIX/resources. Populate that compatibility directory
          # from conda-forge's actual Qt data layout.
          mkdir -p "$QT_PREFIX/resources"

          resources=(
            icudtl.dat
            qtwebengine_resources.pak
            qtwebengine_resources_100p.pak
            qtwebengine_resources_200p.pak
            qtwebengine_devtools_resources.pak
            v8_context_snapshot.bin
          )

          for resource in "${resources[@]}"; do
            destination="$QT_PREFIX/resources/$resource"

            if [[ -e "$destination" ]]; then
              continue
            fi

            source_file=""

            for candidate in \
              "$QT_DATA/resources/$resource" \
              "$QT_PREFIX/share/qt6/resources/$resource" \
              "$QT_PREFIX/lib/qt6/resources/$resource"
            do
              if [[ -f "$candidate" ]]; then
                source_file="$candidate"
                break
              fi
            done

            if [[ -z "$source_file" ]]; then
              source_file="$(
                find -L "$QT_PREFIX" \
                  -type f \
                  -name "$resource" \
                  -print \
                  -quit
              )"
            fi

            if [[ -n "$source_file" ]]; then
              echo "$source_file -> $destination"
              ln -sfn "$source_file" "$destination"
            fi
          done

          # The core resource files are mandatory for the help viewer.
          test -f "$QT_PREFIX/resources/qtwebengine_resources.pak"
          test -f "$QT_PREFIX/resources/qtwebengine_resources_100p.pak"
          test -f "$QT_PREFIX/resources/qtwebengine_resources_200p.pak"

          # Qt Creator's deploy script does not copy qtwebengine_locales.
          # Save the actual source directory for the packaging step.
          WEBENGINE_LOCALES=""

          for candidate in \
            "$QT_TRANSLATIONS/qtwebengine_locales" \
            "$QT_PREFIX/share/qt6/translations/qtwebengine_locales" \
            "$QT_PREFIX/translations/qtwebengine_locales"
          do
            if [[ -d "$candidate" ]]; then
              WEBENGINE_LOCALES="$candidate"
              break
            fi
          done

          if [[ -z "$WEBENGINE_LOCALES" ]]; then
            WEBENGINE_LOCALES="$(
              find -L "$QT_PREFIX" \
                -type d \
                -name qtwebengine_locales \
                -print \
                -quit
            )"
          fi

          if [[ -z "$WEBENGINE_LOCALES" || ! -d "$WEBENGINE_LOCALES" ]]; then
            echo "Qt WebEngine locale data was not found." >&2
            exit 1
          fi

          test -n "$(find "$WEBENGINE_LOCALES" -maxdepth 1 -type f -name '*.pak' -print -quit)"

          echo "QTWEBENGINE_LOCALES_SOURCE=$WEBENGINE_LOCALES" \
            >> "$GITHUB_ENV"

      - name: Create self-contained runtime
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          mkdir -p "$INSTALL_DIR"

          cmake --install "$BUILD_DIR" --prefix "$INSTALL_DIR"
          cmake --install "$BUILD_DIR" \
            --prefix "$INSTALL_DIR" \
            --component Dependencies

          # deploy.py copies WebEngineProcess and resource files, but Qt
          # Creator 20 does not copy the WebEngine locale .pak directory.
          mkdir -p "$INSTALL_DIR/lib/Qt/translations"
          rm -rf \
            "$INSTALL_DIR/lib/Qt/translations/qtwebengine_locales"
          cp -a \
            "$QTWEBENGINE_LOCALES_SOURCE" \
            "$INSTALL_DIR/lib/Qt/translations/qtwebengine_locales"

          # Make all private-runtime locations explicit. These are relative to
          # Prefix and do not expose the CI or Micromamba paths.
          for qt_conf in \
            "$INSTALL_DIR/bin/qt.conf" \
            "$INSTALL_DIR/lib/Qt/bin/qt.conf" \
            "$INSTALL_DIR/libexec/qtcreator/qt.conf"
          do
            test -f "$qt_conf"

            grep -q '^LibraryExecutables=' "$qt_conf" \
              || echo 'LibraryExecutables=libexec' >> "$qt_conf"
            grep -q '^Data=' "$qt_conf" \
              || echo 'Data=.' >> "$qt_conf"
            grep -q '^Translations=' "$qt_conf" \
              || echo 'Translations=translations' >> "$qt_conf"
          done

          # Conda's Qt requires a newer C++ runtime than Ubuntu 20.04 supplies.
          mkdir -p "$INSTALL_DIR/lib/Qt/lib"
          for library in \
            libstdc++.so.6 \
            libgcc_s.so.1 \
            libatomic.so.1 \
            libgomp.so.1
          do
            source_library="$CONDA_PREFIX/lib/$library"
            if [[ -e "$source_library" ]]; then
              cp -L "$source_library" "$INSTALL_DIR/lib/Qt/lib/$library"
            fi
          done

          # The private Qt is a runtime for the IDE, not a Qt SDK or a kit.
          # Remove development metadata and qmake/qtpaths if a package copied
          # them. Users must select their own Qt installation in Kits.
          rm -rf \
            "$INSTALL_DIR/lib/Qt/include" \
            "$INSTALL_DIR/lib/Qt/mkspecs" \
            "$INSTALL_DIR/lib/Qt/lib/cmake" \
            "$INSTALL_DIR/lib/Qt/lib/pkgconfig"

          rm -f \
            "$INSTALL_DIR/lib/Qt/bin/qmake" \
            "$INSTALL_DIR/lib/Qt/bin/qmake6" \
            "$INSTALL_DIR/lib/Qt/bin/qtpaths" \
            "$INSTALL_DIR/lib/Qt/bin/qtpaths6"

          find "$INSTALL_DIR/lib/Qt" -type f \
            \( -name '*.prl' -o -name '*.la' \) -delete

          # Do not prepend or append anything to PATH, LD_LIBRARY_PATH,
          # QT_PLUGIN_PATH, QML_IMPORT_PATH, or CMAKE_PREFIX_PATH.
          # Qt Creator uses its deployed relative RPATHs and bin/qt.conf.
          cat > "$INSTALL_DIR/qtcreator.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          # Global Qt variables commonly mix incompatible Qt installations.
          # Kits should define project-specific Qt paths instead.
          unset QT_PLUGIN_PATH
          unset QT_QPA_PLATFORM_PLUGIN_PATH
          unset QML_IMPORT_PATH
          unset QML2_IMPORT_PATH
          unset QTDIR
          unset QT_SELECT

          # Conda's bundled fontconfig library was built with a temporary
          # prefix. Explicitly use the host's font configuration and fonts.
          export FONTCONFIG_FILE="${FONTCONFIG_FILE:-/etc/fonts/fonts.conf}"
          export FONTCONFIG_PATH="${FONTCONFIG_PATH:-/etc/fonts}"

          exec "$ROOT/bin/qtcreator" "$@"
          SCRIPT

          chmod +x "$INSTALL_DIR/qtcreator.sh"

          cat > "$INSTALL_DIR/README-Ubuntu20.txt" <<'README'
          Qt Creator private Qt runtime
          =============================

          Start Qt Creator with:

              ./qtcreator.sh

          The Qt libraries under lib/Qt are only the IDE runtime. They are not
          a development SDK and are intentionally not added to PATH.

          Configure the Qt version used by projects inside Qt Creator:
          Preferences/Options -> Kits -> Qt Versions -> Add

          Select qmake from your actual project Qt installation, for example:

              /opt/Qt/5.15.2/gcc_64/bin/qmake
              /opt/Qt/6.8.3/gcc_64/bin/qmake

          Then create or update a Kit that uses that Qt version.
          README

      - name: Validate plugins, icons, fonts and isolation
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          # Qt's deploy script must have created relocation-safe configuration.
          test -f "$INSTALL_DIR/bin/qt.conf"
          grep -q '^Prefix=../lib/Qt$' "$INSTALL_DIR/bin/qt.conf"

          # Main GUI/platform and SVG icon/image plugins.
          test -f "$INSTALL_DIR/lib/Qt/plugins/platforms/libqxcb.so"
          test -f "$INSTALL_DIR/lib/Qt/plugins/imageformats/libqsvg.so"
          test -f "$INSTALL_DIR/lib/Qt/plugins/iconengines/libqsvgicon.so"
          test -f "$INSTALL_DIR/lib/Qt/lib/libQt6Svg.so.6"

          # Complete Qt WebEngine runtime used by the Help plugin.
          test -x "$INSTALL_DIR/lib/Qt/libexec/QtWebEngineProcess"
          test -f "$INSTALL_DIR/lib/Qt/resources/qtwebengine_resources.pak"
          test -f "$INSTALL_DIR/lib/Qt/resources/qtwebengine_resources_100p.pak"
          test -f "$INSTALL_DIR/lib/Qt/resources/qtwebengine_resources_200p.pak"
          test -d "$INSTALL_DIR/lib/Qt/translations/qtwebengine_locales"
          test -n "$(
            find \
              "$INSTALL_DIR/lib/Qt/translations/qtwebengine_locales" \
              -maxdepth 1 \
              -type f \
              -name '*.pak' \
              -print \
              -quit
          )"

          # Both Qt Creator Designer integrations.
          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libDesigner.so"
          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libQmlDesigner.so"
          test -d "$INSTALL_DIR/lib/qtcreator/plugins/qmldesigner"
          test -d "$INSTALL_DIR/share/qtcreator/qmldesigner"

          # Full Qbs and Clang tooling.
          test -f "$INSTALL_DIR/lib/qtcreator/plugins/libQbsProjectManager.so"
          test -x "$INSTALL_DIR/libexec/qtcreator/clang/bin/clangd"

          # The private Qt runtime must not be detectable as a development Qt.
          test ! -e "$INSTALL_DIR/lib/Qt/bin/qmake"
          test ! -e "$INSTALL_DIR/lib/Qt/bin/qmake6"
          test ! -d "$INSTALL_DIR/lib/Qt/lib/cmake"
          test ! -d "$INSTALL_DIR/lib/Qt/include"

          # Check every packaged ELF object, not only the main executable.
          missing_file="$GITHUB_WORKSPACE/missing-libraries.txt"
          : > "$missing_file"

          while IFS= read -r -d '' candidate; do
            if file -b "$candidate" | grep -q '^ELF '; then
              if ldd "$candidate" 2>/dev/null | grep -F 'not found' \
                  >> "$missing_file"; then
                echo "Missing dependency in: $candidate" >> "$missing_file"
              fi
            fi
          done < <(find "$INSTALL_DIR" -type f -print0)

          if [[ -s "$missing_file" ]]; then
            cat "$missing_file"
            exit 1
          fi

          # Verify the SVG plugins can be parsed using their private qt.conf.
          "$INSTALL_DIR/lib/Qt/bin/qtplugininfo" \
            "$INSTALL_DIR/lib/Qt/plugins/imageformats/libqsvg.so"

          "$INSTALL_DIR/lib/Qt/bin/qtplugininfo" \
            "$INSTALL_DIR/lib/Qt/plugins/iconengines/libqsvgicon.so"

          mkdir -p /tmp/qtcreator-test-home

          # Launch directly without any private Qt environment variables.
          env -i \
            HOME=/tmp/qtcreator-test-home \
            USER=runner \
            PATH=/usr/bin:/bin \
            FONTCONFIG_FILE=/etc/fonts/fonts.conf \
            FONTCONFIG_PATH=/etc/fonts \
            QT_QPA_PLATFORM=offscreen \
            "$INSTALL_DIR/bin/qtcreator" -version

          # The launcher must not modify toolchain-selection variables.
          if grep -E \
              '(^|[[:space:]])(PATH|LD_LIBRARY_PATH|QT_PLUGIN_PATH|QML2_IMPORT_PATH|QML_IMPORT_PATH|CMAKE_PREFIX_PATH)=' \
              "$INSTALL_DIR/qtcreator.sh"; then
            echo "The launcher contaminates project build environments."
            exit 1
          fi

          # Reject text configuration files containing CI/Micromamba paths.
          leaked_paths="$GITHUB_WORKSPACE/leaked-build-paths.txt"
          : > "$leaked_paths"

          while IFS= read -r -d '' candidate; do
            if grep -Iq . "$candidate"; then
              if grep -nF \
                  -e "$CONDA_PREFIX" \
                  -e "$GITHUB_WORKSPACE" \
                  "$candidate" >> "$leaked_paths"; then
                echo "File: $candidate" >> "$leaked_paths"
              fi
            fi
          done < <(find "$INSTALL_DIR" -type f -print0)

          if [[ -s "$leaked_paths" ]]; then
            cat "$leaked_paths"
            exit 1
          fi

      - name: Create archive and checksum
        shell: micromamba-shell {0}
        run: |
          set -euxo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/qtcreator-${QTC_VERSION}-ubuntu20.04-x86_64-complete.tar.xz"

          tar \
            -C "$(dirname "$INSTALL_DIR")" \
            -cJf "$ARCHIVE" \
            "$(basename "$INSTALL_DIR")"

          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          ls -lh "$ARCHIVE" "$ARCHIVE.sha256"

      - name: Upload Qt Creator artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtcreator-${{ env.QTC_VERSION }}-ubuntu20.04-x86_64-complete
          path: |
            qtcreator-${{ env.QTC_VERSION }}-ubuntu20.04-x86_64-complete.tar.xz
            qtcreator-${{ env.QTC_VERSION }}-ubuntu20.04-x86_64-complete.tar.xz.sha256
          if-no-files-found: error
          retention-days: 14
